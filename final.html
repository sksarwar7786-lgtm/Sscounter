<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS Counter</title>
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans pb-20">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [role, setRole] = React.useState('customer');
            const [name, setName] = React.useState('');
            const [mobile, setMobile] = React.useState('');
            const [otp, setOtp] = React.useState('');
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [currentUser, setCurrentUser] = React.useState(null);
            
            // Post-Login Step 1: Address Details Form State
            const [isAddressCompleted, setIsAddressCompleted] = React.useState(false);
            const [addressDetails, setAddressDetails] = React.useState({
                state: '',
                city: '',
                pincode: '',
                area: '',
                landmark: ''
            });

            // Post-Login Step 2: Optional Profile Photo Page State
            const [isProfilePhotoCompleted, setIsProfilePhotoCompleted] = React.useState(false);
            const [profilePhotoInput, setProfilePhotoInput] = React.useState('');

            const [searchQuery, setSearchQuery] = React.useState('');
            const [adminUserSearch, setAdminUserSearch] = React.useState('');
            const [adminProductSearch, setAdminProductSearch] = React.useState('');
            const [adminActiveTab, setAdminActiveTab] = React.useState('users');
            
            const [showMenu, setShowMenu] = React.useState(false);
            const [activeModal, setActiveModal] = React.useState(null);

            // Strictly Fixed Admins (Sk Sarwar Ali & Sakila Bano)
            const fixedAdmins = [
                { id: 401, name: "Sk Sarwar Ali", mobile: "6370404454", role: "admin", blocked: false, addressCompleted: true, photoCompleted: true, profilePhoto: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=300", sellerVerified: true, sellerRequestStatus: "approved" },
                { id: 402, name: "Sakila Bano", mobile: "9556460534", role: "admin", blocked: false, addressCompleted: true, photoCompleted: true, profilePhoto: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=300", sellerVerified: true, sellerRequestStatus: "approved" }
            ];

            const [users, setUsers] = React.useState([
                { id: 1, name: "Rahul", mobile: "9876543210", role: "customer", blocked: false, addressCompleted: true, photoCompleted: true, profilePhoto: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=300", address: { state: "Odisha", city: "Bhubaneswar", pincode: "751001", area: "Saheed Nagar", landmark: "Near Temple" }, sellerVerified: false, sellerRequestStatus: "none" },
                { id: 2, name: "Vikas", mobile: "9000000001", role: "seller", blocked: false, addressCompleted: true, photoCompleted: true, profilePhoto: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300", address: { state: "Delhi", city: "New Delhi", pincode: "110001", area: "Connaught Place", landmark: "Central Park" }, sellerVerified: true, sellerRequestStatus: "approved" },
                ...fixedAdmins
            ]);

            const [sellersProducts, setSellersProducts] = React.useState([
                { 
                    id: 1, 
                    name: "Wireless Headphones", 
                    type: "Electronics", 
                    price: 1499, 
                    dimensions: "10x5 cm, 200g", 
                    address: "Connaught Place, New Delhi", 
                    pincode: "110001", 
                    photo: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=300", 
                    sellerMobile: "9000000001",
                    sellerName: "Vikas",
                    sellerPhoto: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=300",
                    sellerVerified: true,
                    ratings: [5, 4, 5]
                }
            ]);

            const [notifications, setNotifications] = React.useState([]);

            // Orders List mapped to respective sellers via sellerMobile
            const [orders, setOrders] = React.useState([
                { 
                    id: 1, 
                    productId: 1,
                    itemName: "Wireless Headphones", 
                    price: 1499, 
                    customerName: "Rahul", 
                    customerMobile: "9876543210", 
                    sellerMobile: "9000000001",
                    status: "Pending", 
                    customerAddress: "Saheed Nagar, Bhubaneswar, Odisha - 751001",
                    history: [
                        { status: "Order Placed", time: new Date().toLocaleTimeString() }
                    ]
                }
            ]);

            const [newProduct, setNewProduct] = React.useState({ 
                name: '', type: '', price: '', dimensions: '', address: '', pincode: '', photo: '' 
            });

            // Login Validation Flow
            const handleLogin = (e) => {
                e.preventDefault();

                const nameRegex = /^[A-Za-z\s]{4,18}$/;
                if (!nameRegex.test(name.trim())) {
                    return alert("❌ Name mein sirf letters (A-Z) hone chahiye, aur length 4 se 18 characters ke beech honi chahiye.");
                }

                const mobileRegex = /^[6-9]\d{9}$/;
                if (!mobileRegex.test(mobile)) {
                    return alert("❌ Mobile number strictly 10 digits ka hona chahiye aur 6, 7, 8, 9 sa start hona chahiye.");
                }

                const otpRegex = /^\d{4}$/;
                if (!otpRegex.test(otp)) {
                    return alert("❌ OTP mein sirf 4 digits hone chahiye.");
                }

                const matchedAdmin = fixedAdmins.find(a => a.mobile === mobile);
                if (matchedAdmin) {
                    if (matchedAdmin.name.toLowerCase() !== name.trim().toLowerCase()) {
                        return alert(`❌ Admin Name mismatch! Is mobile number ke liye authorized admin name '${matchedAdmin.name}' hai.`);
                    }
                    setCurrentUser(matchedAdmin);
                    setIsLoggedIn(true);
                    setIsAddressCompleted(true);
                    setIsProfilePhotoCompleted(true);
                    return;
                }

                if (role === 'admin') {
                    return alert("❌ Access Denied! Yeh option available nahi hai.");
                }

                let existingUser = users.find(u => u.mobile === mobile);

                if (existingUser) {
                    if (existingUser.blocked) {
                        return alert("❌ This account is blocked by Admin!");
                    }
                    if (existingUser.role !== role) {
                        return alert(`❌ Access Denied! This mobile number is registered as a '${existingUser.role}', not as a '${role}'.`);
                    }
                    existingUser.name = name.trim();
                    setCurrentUser(existingUser);
                    setIsLoggedIn(true);
                    setIsAddressCompleted(existingUser.addressCompleted || false);
                    setIsProfilePhotoCompleted(existingUser.photoCompleted || false);
                } else {
                    const newUserObj = { 
                        id: Date.now(), 
                        name: name.trim(), 
                        mobile, 
                        role, 
                        blocked: false, 
                        addressCompleted: false, 
                        photoCompleted: false,
                        profilePhoto: '',
                        address: null,
                        sellerVerified: false,
                        sellerRequestStatus: "none"
                    };
                    setUsers([...users, newUserObj]);
                    setCurrentUser(newUserObj);
                    setIsLoggedIn(true);
                    setIsAddressCompleted(false);
                    setIsProfilePhotoCompleted(false);
                }
            };

            const handleAddressSubmit = (e) => {
                e.preventDefault();
                const updatedUser = { 
                    ...currentUser, 
                    addressCompleted: true, 
                    address: {
                        state: addressDetails.state.trim(),
                        city: addressDetails.city.trim(),
                        pincode: addressDetails.pincode.trim(),
                        area: addressDetails.area.trim(),
                        landmark: addressDetails.landmark.trim()
                    }
                };

                setCurrentUser(updatedUser);
                setUsers(users.map(u => u.id === updatedUser.id ? updatedUser : u));
                setIsAddressCompleted(true);
            };

            const handleProfilePhotoFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setProfilePhotoInput(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleProfilePhotoSubmit = (e) => {
                e.preventDefault();
                const updatedUser = {
                    ...currentUser,
                    photoCompleted: true,
                    profilePhoto: profilePhotoInput || currentUser.profilePhoto || "https://via.placeholder.com/150"
                };

                setCurrentUser(updatedUser);
                setUsers(users.map(u => u.id === updatedUser.id ? updatedUser : u));
                setIsProfilePhotoCompleted(true);
                alert("✅ Profile setup completed successfully!");
            };

            const handleAdminProfilePhotoUpdate = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        const updatedPhoto = reader.result;
                        const updatedUser = { ...currentUser, profilePhoto: updatedPhoto };
                        setCurrentUser(updatedUser);
                        setUsers(users.map(u => u.id === updatedUser.id ? updatedUser : u));
                        alert("✅ Admin profile picture updated successfully!");
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleSkipProfilePhoto = () => {
                const updatedUser = {
                    ...currentUser,
                    photoCompleted: true,
                    profilePhoto: currentUser.profilePhoto || "https://via.placeholder.com/150"
                };

                setCurrentUser(updatedUser);
                setUsers(users.map(u => u.id === updatedUser.id ? updatedUser : u));
                setIsProfilePhotoCompleted(true);
            };

            const handleLogout = () => {
                setIsLoggedIn(false);
                setCurrentUser(null);
                setMobile('');
                setName('');
                setOtp('');
                setRole('customer');
                setIsAddressCompleted(false);
                setIsProfilePhotoCompleted(false);
                setAddressDetails({ state: '', city: '', pincode: '', area: '', landmark: '' });
                setProfilePhotoInput('');
                setShowMenu(false);
                setActiveModal(null);
            };

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        setNewProduct(prev => ({ ...prev, photo: reader.result }));
                    };
                    reader.readAsDataURL(file);
                }
            };

            const handleAddProduct = (e) => {
                e.preventDefault();
                if (currentUser.role === 'seller' && !currentUser.sellerVerified) {
                    return alert("❌ Aapka seller verification abhi admin dwara approve nahi hua hai.");
                }

                const productObj = {
                    id: Date.now(),
                    name: newProduct.name,
                    type: newProduct.type,
                    price: Number(newProduct.price),
                    dimensions: newProduct.dimensions,
                    address: `${currentUser.address?.area ? currentUser.address.area + ', ' : ''}${currentUser.address?.city}, ${currentUser.address?.state}`,
                    pincode: currentUser.address?.pincode || '',
                    photo: newProduct.photo || "https://via.placeholder.com/150",
                    sellerMobile: currentUser.mobile,
                    sellerName: currentUser.name,
                    sellerPhoto: currentUser.profilePhoto || "https://via.placeholder.com/150",
                    sellerVerified: currentUser.sellerVerified,
                    ratings: []
                };
                setSellersProducts([productObj, ...sellersProducts]);
                setNewProduct({ name: '', type: '', price: '', dimensions: '', address: '', pincode: '', photo: '' });
                alert("Product Published Successfully!");
            };

            const handleRateProduct = (productId, ratingValue) => {
                if (currentUser.role !== 'customer') {
                    return alert("❌ Sirf customers hi products ko rating de sakte hain.");
                }
                setSellersProducts(sellersProducts.map(p => {
                    if (p.id === productId) {
                        const currentRatings = p.ratings || [];
                        return { ...p, ratings: [...currentRatings, ratingValue] };
                    }
                    return p;
                }));
                alert(`⭐ Thank you! You rated this product ${ratingValue} stars.`);
            };

            const handleSellerRemoveProduct = (productId) => {
                if (window.confirm("Are you sure you want to remove this product?")) {
                    setSellersProducts(sellersProducts.filter(item => item.id !== productId));
                    alert("Product deleted successfully.");
                }
            };

            const handleAdminRemoveProduct = (product) => {
                if (window.confirm(`Admin Action: Remove "${product.name}"?`)) {
                    setSellersProducts(sellersProducts.filter(item => item.id !== product.id));
                    
                    const newNotif = {
                        id: Date.now(),
                        sellerMobile: product.sellerMobile,
                        message: `⚠️ Admin ne aapka product "${product.name}" platform se block/remove kar diya hai.`,
                        time: new Date().toLocaleTimeString()
                    };
                    setNotifications(prev => [newNotif, ...prev]);
                    alert(`Product blocked & removed successfully.`);
                }
            };

            const handleRequestSellerStatus = () => {
                const updatedUser = { ...currentUser, sellerRequestStatus: "pending" };
                setCurrentUser(updatedUser);
                setUsers(users.map(u => u.id === updatedUser.id ? updatedUser : u));
                alert("✅ Seller banne ki request Admin ko bhej di gayi hai!");
            };

            const handleAdminApproveSeller = (userId) => {
                const updatedUsers = users.map(u => {
                    if (u.id === userId) {
                        return { ...u, sellerVerified: true, sellerRequestStatus: "approved" };
                    }
                    return u;
                });
                setUsers(updatedUsers);

                const targetUser = users.find(u => u.id === userId);
                if (targetUser) {
                    setSellersProducts(sellersProducts.map(p => p.sellerMobile === targetUser.mobile ? { ...p, sellerVerified: true } : p));
                }

                alert("✅ Seller request approved successfully!");
            };

            const handleAdminRejectSeller = (userId) => {
                const updatedUsers = users.map(u => {
                    if (u.id === userId) {
                        return { ...u, sellerVerified: false, sellerRequestStatus: "rejected" };
                    }
                    return u;
                });
                setUsers(updatedUsers);
                alert("❌ Seller request rejected.");
            };

            // Order Creation for Specific Seller
            const createOrder = (product) => {
                const custAddressStr = currentUser.address 
                    ? `${currentUser.address.area ? currentUser.address.area + ', ' : ''}${currentUser.address.city}, ${currentUser.address.state} - ${currentUser.address.pincode}`
                    : "Address not specified";

                const newOrderObj = {
                    id: Date.now(),
                    productId: product.id,
                    itemName: product.name,
                    price: product.price,
                    customerName: currentUser.name,
                    customerMobile: currentUser.mobile,
                    sellerMobile: product.sellerMobile,
                    status: "Pending",
                    customerAddress: custAddressStr,
                    history: [
                        { status: "Order Placed", time: new Date().toLocaleTimeString() }
                    ]
                };
                setOrders([newOrderObj, ...orders]);
                alert("✅ Order Placed Successfully! Seller ko aapka order aur details bhej di gayi hain.");
            };

            // Seller Order Status Update Handler
            const handleUpdateOrderStatus = (orderId, newStatus) => {
                setOrders(orders.map(o => {
                    if (o.id === orderId) {
                        const updatedHistory = [...o.history, { status: newStatus, time: new Date().toLocaleTimeString() }];
                        return { ...o, status: newStatus, history: updatedHistory };
                    }
                    return o;
                }));
                alert(`✅ Order status updated to '${newStatus}'.`);
            };

            const toggleBlock = (id) => {
                const targetUser = users.find(u => u.id === id);
                if (targetUser && targetUser.role === 'admin') {
                    return alert("❌ Fixed Admins cannot be blocked!");
                }
                setUsers(users.map(u => u.id === id ? { ...u, blocked: !u.blocked } : u));
            };

            const filteredProducts = sellersProducts.filter(p => 
                p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                p.type.toLowerCase().includes(searchQuery.toLowerCase()) ||
                p.pincode.includes(searchQuery)
            );

            const filteredAdminUsers = users.filter(u => 
                u.mobile.includes(adminUserSearch.trim()) || 
                u.name.toLowerCase().includes(adminUserSearch.trim().toLowerCase())
            );

            const filteredAdminProducts = sellersProducts.filter(p =>
                p.name.toLowerCase().includes(adminProductSearch.toLowerCase()) ||
                p.sellerName.toLowerCase().includes(adminProductSearch.toLowerCase()) ||
                p.sellerMobile.includes(adminProductSearch)
            );

            const sellerNotifications = notifications.filter(n => currentUser && n.sellerMobile === currentUser.mobile);
            
            // Filter orders for current seller or current customer
            const currentSellerOrders = currentUser && currentUser.role === 'seller' 
                ? orders.filter(o => o.sellerMobile === currentUser.mobile) 
                : [];
            
            const currentCustomerOrders = currentUser && currentUser.role === 'customer'
                ? orders.filter(o => o.customerMobile === currentUser.mobile)
                : [];

            // 1. Login Screen
            if (!isLoggedIn) {
                return (
                    <div className="flex h-screen items-center justify-center bg-orange-500">
                        <form onSubmit={handleLogin} className="bg-white p-8 rounded-xl shadow-md w-96">
                            <h2 className="text-3xl font-bold mb-6 text-center text-orange-600" style={{ fontSize: 'calc(1.875rem + 4px)' }}>🚀 75 Indian Azad</h2>

                            <label className="block mb-2 font-bold text-base text-gray-800">Select Role</label>
                            <select value={role} onChange={e => setRole(e.target.value)} className="w-full p-2 border rounded mb-4 text-base font-semibold">
                                <option value="customer">Customer</option>
                                <option value="seller">Seller</option>
                            </select>

                            <label className="block mb-1 font-bold text-base text-gray-800">Full Name (4-18 letters only)</label>
                            <input 
                                type="text" 
                                placeholder="e.g. Rahul" 
                                value={name} 
                                onChange={e => setName(e.target.value)} 
                                className="w-full p-2 border rounded mb-4 text-base" 
                                required 
                            />

                            <label className="block mb-1 font-bold text-base text-gray-800">Mobile Number (10 digits, starts with 6-9)</label>
                            <input 
                                type="text" 
                                maxLength="10"
                                placeholder="Enter mobile number" 
                                value={mobile} 
                                onChange={e => setMobile(e.target.value.replace(/\D/g, ''))} 
                                className="w-full p-2 border rounded mb-4 text-base" 
                                required 
                            />

                            <label className="block mb-1 font-bold text-base text-gray-800">OTP (Fixed 4 digits)</label>
                            <input 
                                type="text" 
                                maxLength="4"
                                placeholder="Enter 4-digit OTP" 
                                value={otp}
                                onChange={e => setOtp(e.target.value.replace(/\D/g, ''))}
                                className="w-full p-2 border rounded mb-6 text-base" 
                                required 
                            />

                            <button type="submit" className="w-full bg-orange-600 text-white p-3 rounded font-bold text-lg hover:bg-orange-700">Login</button>
                        </form>
                    </div>
                );
            }

            // 2. Address Form
            if (currentUser.role !== 'admin' && !isAddressCompleted) {
                return (
                    <div className="flex h-screen items-center justify-center bg-gray-100 p-4">
                        <form onSubmit={handleAddressSubmit} className="bg-white p-8 rounded-xl shadow-md w-full max-w-lg">
                            <h2 className="text-2xl font-bold mb-2 text-center text-orange-600">📍 Enter Your Address Details</h2>
                            <p className="text-xs text-gray-500 mb-6 text-center">State, City, and Pincode are mandatory.</p>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block mb-1 font-medium text-sm">State</label>
                                    <input 
                                        type="text" 
                                        placeholder="e.g. Odisha" 
                                        value={addressDetails.state} 
                                        onChange={e => setAddressDetails({...addressDetails, state: e.target.value})} 
                                        className="w-full p-2 border rounded mb-3 text-sm" 
                                        required 
                                    />
                                </div>
                                <div>
                                    <label className="block mb-1 font-medium text-sm">City</label>
                                    <input 
                                        type="text" 
                                        placeholder="e.g. Bhubaneswar" 
                                        value={addressDetails.city} 
                                        onChange={e => setAddressDetails({...addressDetails, city: e.target.value})} 
                                        className="w-full p-2 border rounded mb-3 text-sm" 
                                        required 
                                    />
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block mb-1 font-medium text-sm">Pincode</label>
                                    <input 
                                        type="text" 
                                        maxLength="6"
                                        placeholder="e.g. 751001" 
                                        value={addressDetails.pincode} 
                                        onChange={e => setAddressDetails({...addressDetails, pincode: e.target.value.replace(/\D/g, '')})} 
                                        className="w-full p-2 border rounded mb-3 text-sm" 
                                        required 
                                    />
                                </div>
                                <div>
                                    <label className="block mb-1 font-medium text-sm">Area / Village (Optional)</label>
                                    <input 
                                        type="text" 
                                        placeholder="e.g. Saheed Nagar" 
                                        value={addressDetails.area} 
                                        onChange={e => setAddressDetails({...addressDetails, area: e.target.value})} 
                                        className="w-full p-2 border rounded mb-3 text-sm" 
                                    />
                                </div>
                            </div>

                            <label className="block mb-1 font-medium text-sm">Landmark Near By (Optional)</label>
                            <input 
                                type="text" 
                                placeholder="e.g. Near Temple" 
                                value={addressDetails.landmark} 
                                onChange={e => setAddressDetails({...addressDetails, landmark: e.target.value})} 
                                className="w-full p-2 border rounded mb-6 text-sm" 
                            />

                            <button type="submit" className="w-full bg-orange-600 text-white p-2.5 rounded font-bold hover:bg-orange-700">Save & Next</button>
                        </form>
                    </div>
                );
            }

            // 3. Profile Photo Page
            if (currentUser.role !== 'admin' && !isProfilePhotoCompleted) {
                return (
                    <div className="flex h-screen items-center justify-center bg-gray-100 p-4">
                        <div className="bg-white p-8 rounded-xl shadow-md w-full max-w-md text-center">
                            <h2 className="text-2xl font-bold mb-2 text-orange-600">📷 Upload Profile Photo</h2>
                            <p className="text-xs text-gray-500 mb-6">Choose your photo from your gallery.</p>

                            <form onSubmit={handleProfilePhotoSubmit}>
                                <div className="mb-6 flex flex-col items-center">
                                    <label className="w-full flex flex-col items-center px-4 py-6 bg-white rounded-lg border-2 border-dashed border-gray-300 cursor-pointer hover:bg-gray-50">
                                        <span className="text-sm font-semibold text-gray-600 mb-2">📁 Select Image from Gallery</span>
                                        <input type="file" accept="image/*" onChange={handleProfilePhotoFileChange} className="hidden" />
                                        <span className="text-xs text-orange-500">Browse files</span>
                                    </label>

                                    {profilePhotoInput && (
                                        <div className="mt-4">
                                            <p className="text-xs text-gray-500 mb-1">Preview:</p>
                                            <img src={profilePhotoInput} alt="Preview" className="w-24 h-24 object-cover rounded-full mx-auto border-2 border-orange-500 shadow" />
                                        </div>
                                    )}
                                </div>

                                <div className="flex gap-3">
                                    <button type="button" onClick={handleSkipProfilePhoto} className="w-1/2 bg-gray-300 text-gray-700 p-2.5 rounded font-bold hover:bg-gray-400 text-sm">Skip</button>
                                    <button type="submit" className="w-1/2 bg-orange-600 text-white p-2.5 rounded font-bold hover:bg-orange-700 text-sm">Save & Continue</button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            // 4. Main Dashboard
            return (
                <div className="p-6 max-w-6xl mx-auto relative min-h-screen">
                    <div className="mb-6 bg-white p-4 rounded shadow flex justify-between items-center relative">
                        <div className="flex items-center space-x-3">
                            <img 
                                src={currentUser.profilePhoto || "https://via.placeholder.com/150"} 
                                alt="Profile" 
                                className="w-11 h-11 object-cover rounded-full border shadow-sm" 
                            />
                            <div>
                                <h1 className="text-lg font-bold flex items-center gap-1.5">
                                    Welcome, <span className="text-orange-600">{currentUser.name}</span>
                                    {currentUser.sellerVerified && (
                                        <span className="text-orange-600 text-sm font-black" title="Verified Seller">✔️✔️</span>
                                    )}
                                </h1>
                                <p className="text-xs text-gray-500 uppercase tracking-wide font-semibold">{currentUser.role}</p>
                            </div>
                        </div>

                        <div className="flex items-center gap-2">
                            {currentUser.role === 'seller' && (
                                <button onClick={() => setActiveModal('sellerOrders')} className="relative bg-orange-100 text-orange-700 p-2 rounded-lg font-bold text-xs flex items-center gap-1 px-3">
                                    📦 View Orders ({currentSellerOrders.length})
                                </button>
                            )}

                            {currentUser.role === 'seller' && sellerNotifications.length > 0 && (
                                <button onClick={() => setActiveModal('notifications')} className="relative bg-red-100 text-red-600 p-2 rounded-full font-bold text-xs flex items-center gap-1 px-3">
                                    🔔 ({sellerNotifications.length})
                                </button>
                            )}
                            <button onClick={() => setShowMenu(!showMenu)} className="p-2 text-gray-700 hover:bg-gray-100 rounded focus:outline-none font-bold text-lg">
                                ☰
                            </button>
                        </div>

                        {showMenu && (
                            <div className="absolute right-4 top-16 bg-white border rounded shadow-md w-48 z-50 py-2">
                                <button onClick={() => { setActiveModal('profile'); setShowMenu(false); }} className="w-full text-left px-4 py-2 hover:bg-gray-100 text-sm">👤 Profile</button>
                                <button onClick={() => { setActiveModal('orders'); setShowMenu(false); }} className="w-full text-left px-4 py-2 hover:bg-gray-100 text-sm">📦 My Orders</button>
                                {currentUser.role === 'seller' && currentUser.sellerRequestStatus === 'none' && (
                                    <button onClick={() => { handleRequestSellerStatus(); setShowMenu(false); }} className="w-full text-left px-4 py-2 hover:bg-gray-100 text-sm">✔️ Request Verification</button>
                                )}
                                <button onClick={handleLogout} className="w-full text-left px-4 py-2 hover:bg-gray-100 text-sm text-red-600 font-bold">🚪 Logout</button>
                            </div>
                        )}
                    </div>

                    {currentUser.role === 'admin' ? (
                        <div>
                            <div className="flex gap-4 mb-6 border-b pb-4">
                                <button onClick={() => setAdminActiveTab('users')} className={`px-4 py-2 rounded font-bold text-sm ${adminActiveTab === 'users' ? 'bg-orange-600 text-white' : 'bg-white text-gray-700 border'}`}>👥 Manage Users ({users.length})</button>
                                <button onClick={() => setAdminActiveTab('products')} className={`px-4 py-2 rounded font-bold text-sm ${adminActiveTab === 'products' ? 'bg-orange-600 text-white' : 'bg-white text-gray-700 border'}`}>📦 Manage Products ({sellersProducts.length})</button>
                            </div>

                            {adminActiveTab === 'users' ? (
                                <div className="bg-white p-6 rounded shadow">
                                    <h2 className="text-xl font-bold mb-4">👥 User & Seller Management</h2>
                                    <input 
                                        type="text" 
                                        placeholder="Search user by name or mobile..." 
                                        value={adminUserSearch}
                                        onChange={e => setAdminUserSearch(e.target.value)}
                                        className="w-full p-2 border rounded mb-4 text-sm"
                                    />
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse text-sm">
                                            <thead>
                                                <tr className="bg-gray-100 border-b">
                                                    <th className="p-3">User</th>
                                                    <th className="p-3">Role</th>
                                                    <th className="p-3">Mobile</th>
                                                    <th className="p-3">Seller Verification</th>
                                                    <th className="p-3">Action</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {filteredAdminUsers.map(u => (
                                                    <tr key={u.id} className="border-b hover:bg-gray-50">
                                                        <td className="p-3 flex items-center gap-2">
                                                            <img src={u.profilePhoto || "https://via.placeholder.com/150"} alt="" className="w-8 h-8 rounded-full object-cover" />
                                                            <span className="font-semibold">{u.name}</span>
                                                        </td>
                                                        <td className="p-3 uppercase text-xs font-bold text-orange-600">{u.role}</td>
                                                        <td className="p-3">{u.mobile}</td>
                                                        <td className="p-3">
                                                            {u.role === 'seller' ? (
                                                                u.sellerVerified ? (
                                                                    <span className="text-green-600 font-bold text-xs">Verified (✔️✔️)</span>
                                                                ) : u.sellerRequestStatus === 'pending' ? (
                                                                    <div className="flex gap-2 items-center">
                                                                        <span className="text-orange-500 text-xs font-bold">Pending Request</span>
                                                                        <button onClick={() => handleAdminApproveSeller(u.id)} className="bg-green-600 text-white px-2 py-1 rounded text-xs">Approve</button>
                                                                        <button onClick={() => handleAdminRejectSeller(u.id)} className="bg-red-600 text-white px-2 py-1 rounded text-xs">Reject</button>
                                                                    </div>
                                                                ) : (
                                                                    <span className="text-gray-400 text-xs">Not Requested</span>
                                                                )
                                                            ) : (
                                                                <span className="text-gray-300 text-xs">-</span>
                                                            )}
                                                        </td>
                                                        <td className="p-3">
                                                            {u.role !== 'admin' && (
                                                                <button onClick={() => toggleBlock(u.id)} className={`px-3 py-1 rounded text-xs font-bold text-white ${u.blocked ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}`}>
                                                                    {u.blocked ? 'Unblock' : 'Block'}
                                                                </button>
                                                            )}
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            ) : (
                                <div className="bg-white p-6 rounded shadow">
                                    <h2 className="text-xl font-bold mb-4">📦 All Platform Products (Admin Control)</h2>
                                    <input 
                                        type="text" 
                                        placeholder="Search product name or seller..." 
                                        value={adminProductSearch}
                                        onChange={e => setAdminProductSearch(e.target.value)}
                                        className="w-full p-2 border rounded mb-4 text-sm"
                                    />
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {filteredAdminProducts.map(prod => (
                                            <div key={prod.id} className="border p-4 rounded shadow-sm bg-white flex flex-col justify-between">
                                                <div>
                                                    <img src={prod.photo} alt="" className="w-full h-36 object-cover rounded mb-2" />
                                                    <h3 className="font-bold">{prod.name}</h3>
                                                    <p className="text-sm font-semibold text-orange-600">₹{prod.price}</p>
                                                    <p className="text-xs text-gray-500 mt-1">Seller: {prod.sellerName} ({prod.sellerMobile})</p>
                                                </div>
                                                <button onClick={() => handleAdminRemoveProduct(prod)} className="mt-3 bg-red-600 text-white py-1.5 px-3 rounded text-xs font-bold hover:bg-red-700">
                                                    🗑️ Remove / Block Product
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}
                        </div>
                    ) : (
                        <div>
                            <div className="mb-6 flex gap-4 items-center">
                                <input 
                                    type="text" 
                                    placeholder="🔍 Search product name, type, or pincode..." 
                                    value={searchQuery} 
                                    onChange={e => setSearchQuery(e.target.value)}
                                    className="w-full p-3 border rounded shadow-sm text-sm"
                                />
                            </div>

                            {currentUser.role === 'seller' && (
                                <div className="bg-white p-6 rounded shadow mb-8">
                                    <h2 className="text-xl font-bold mb-4 text-orange-600">➕ Publish New Product</h2>
                                    {!currentUser.sellerVerified && (
                                        <div className="mb-4 bg-yellow-100 border-l-4 border-yellow-500 p-3 text-xs text-yellow-700">
                                            ⚠️ **Note:** Your seller account is pending admin verification.
                                        </div>
                                    )}
                                    <form onSubmit={handleAddProduct} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <input type="text" placeholder="Product Name" value={newProduct.name} onChange={e => setNewProduct({...newProduct, name: e.target.value})} className="p-2 border rounded text-sm" required />
                                        <input type="text" placeholder="Category Type (e.g. Electronics)" value={newProduct.type} onChange={e => setNewProduct({...newProduct, type: e.target.value})} className="p-2 border rounded text-sm" required />
                                        <input type="number" placeholder="Price in ₹" value={newProduct.price} onChange={e => setNewProduct({...newProduct, price: e.target.value})} className="p-2 border rounded text-sm" required />
                                        <input type="text" placeholder="Dimensions / Weight (e.g. 10x5 cm)" value={newProduct.dimensions} onChange={e => setNewProduct({...newProduct, dimensions: e.target.value})} className="p-2 border rounded text-sm" required />
                                        
                                        <div className="md:col-span-2">
                                            <label className="block mb-1 text-xs font-medium text-gray-600">Product Image (Gallery Upload)</label>
                                            <input type="file" accept="image/*" onChange={handleImageChange} className="w-full p-2 border rounded text-sm bg-gray-50" required />
                                        </div>

                                        <button type="submit" className="md:col-span-2 bg-orange-600 text-white p-2.5 rounded font-bold hover:bg-orange-700 text-sm">Publish Product</button>
                                    </form>
                                </div>
                            )}

                            <h2 className="text-xl font-bold mb-4">🛒 Available Products</h2>
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                {filteredProducts.map(product => {
                                    const ratingsArr = product.ratings || [];
                                    const avgRating = ratingsArr.length > 0 
                                        ? (ratingsArr.reduce((a, b) => a + b, 0) / ratingsArr.length).toFixed(1) 
                                        : "No ratings yet";

                                    return (
                                        <div key={product.id} className="bg-white rounded shadow p-4 flex flex-col justify-between">
                                            <div>
                                                <img src={product.photo} alt={product.name} className="w-full h-48 object-cover rounded mb-3" />
                                                <div className="flex justify-between items-start mb-1">
                                                    <h3 className="font-bold text-lg">{product.name}</h3>
                                                    <span className="text-xs bg-orange-100 text-orange-800 px-2 py-1 rounded font-semibold">{product.type}</span>
                                                </div>
                                                <p className="text-xl font-bold text-orange-600 mb-1">₹{product.price}</p>
                                                
                                                <div className="flex items-center gap-1 text-xs text-amber-600 font-bold mb-2">
                                                    <span>⭐</span>
                                                    <span>{avgRating}</span>
                                                    <span className="text-gray-400 font-normal">({ratingsArr.length} reviews)</span>
                                                </div>

                                                <p className="text-xs text-gray-500 mb-1">📍 {product.address} - {product.pincode}</p>
                                                <p className="text-xs text-gray-500 mb-3">📦 Size: {product.dimensions}</p>

                                                <div className="flex items-center gap-2 border-t pt-2 mt-2">
                                                    <img src={product.sellerPhoto} alt="" className="w-7 h-7 rounded-full object-cover" />
                                                    <span className="text-xs font-medium text-gray-700 flex items-center gap-1">
                                                        {product.sellerName}
                                                        {product.sellerVerified && <span className="text-orange-600 text-xs font-bold">✔️✔️</span>}
                                                    </span>
                                                </div>

                                                {currentUser.role === 'customer' && (
                                                    <div className="mt-3 bg-gray-50 p-2 rounded border text-center">
                                                        <p className="text-[11px] text-gray-600 font-semibold mb-1">Rate this Seller Product:</p>
                                                        <div className="flex justify-center gap-1">
                                                            {[1, 2, 3, 4, 5].map((star) => (
                                                                <button 
                                                                    key={star}
                                                                    onClick={() => handleRateProduct(product.id, star)}
                                                                    className="text-lg hover:scale-125 transition-transform text-amber-400 focus:outline-none"
                                                                    title={`Rate ${star} Stars`}
                                                                >
                                                                    ★
                                                                </button>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>

                                            <div className="mt-4 flex gap-2">
                                                {currentUser.role === 'customer' && (
                                                    <button onClick={() => createOrder(product)} className="w-full bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700 text-xs">
                                                        🛍️ Buy Now
                                                    </button>
                                                )}
                                                {currentUser.role === 'seller' && product.sellerMobile === currentUser.mobile && (
                                                    <button onClick={() => handleSellerRemoveProduct(product.id)} className="w-full bg-red-600 text-white py-2 rounded font-bold hover:bg-red-700 text-xs">
                                                        🗑️ Remove My Product
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {activeModal && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
                            <div className="bg-white p-6 rounded-xl max-w-lg w-full relative max-h-[90vh] overflow-y-auto">
                                <button onClick={() => setActiveModal(null)} className="absolute right-4 top-4 text-gray-500 font-bold text-lg">✕</button>

                                {activeModal === 'profile' && (
                                    <div>
                                        <h2 className="text-xl font-bold mb-4 text-orange-600">👤 User Profile</h2>
                                        <div className="flex flex-col items-center mb-4">
                                            <img src={currentUser.profilePhoto || "https://via.placeholder.com/150"} alt="" className="w-24 h-24 rounded-full object-cover border-2 border-orange-500 shadow mb-2" />
                                            {currentUser.role === 'admin' && (
                                                <div className="mt-2 w-full text-center">
                                                    <label className="block text-xs text-gray-500 mb-1 font-semibold">Change Profile Picture:</label>
                                                    <input type="file" accept="image/*" onChange={handleAdminProfilePhotoUpdate} className="text-xs border p-1 rounded w-full bg-gray-50 cursor-pointer" />
                                                </div>
                                            )}
                                        </div>
                                        <div className="space-y-2 text-sm">
                                            <p><strong>Name:</strong> {currentUser.name}</p>
                                            <p><strong>Mobile:</strong> {currentUser.mobile}</p>
                                            <p><strong>Role:</strong> <span className="uppercase font-semibold text-orange-600">{currentUser.role}</span></p>
                                            {currentUser.address && (
                                                <div className="border-t pt-2 mt-2">
                                                    <p className="font-semibold mb-1">Saved Address:</p>
                                                    <p className="text-xs text-gray-600">{currentUser.address.area ? currentUser.address.area + ', ' : ''}{currentUser.address.city}, {currentUser.address.state} - {currentUser.address.pincode}</p>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {activeModal === 'orders' && (
                                    <div>
                                        <h2 className="text-xl font-bold mb-4 text-orange-600">📦 My Orders History</h2>
                                        <div className="space-y-3">
                                            {currentCustomerOrders.length === 0 ? (
                                                <p className="text-xs text-gray-500">No orders placed yet.</p>
                                            ) : (
                                                currentCustomerOrders.map(o => (
                                                    <div key={o.id} className="border p-3 rounded text-sm bg-gray-50">
                                                        <p className="font-bold">{o.itemName}</p>
                                                        <p className="text-orange-600 font-semibold">₹{o.price}</p>
                                                        <p className="text-xs text-gray-500">Status: <span className="text-green-600 font-bold">{o.status}</span></p>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                )}

                                {activeModal === 'sellerOrders' && (
                                    <div>
                                        <h2 className="text-xl font-bold mb-4 text-orange-600">📦 Customer Orders Received</h2>
                                        <div className="space-y-4">
                                            {currentSellerOrders.length === 0 ? (
                                                <p className="text-xs text-gray-500">No orders received for your products yet.</p>
                                            ) : (
                                                currentSellerOrders.map(o => (
                                                    <div key={o.id} className="border p-4 rounded bg-gray-50 text-sm space-y-2">
                                                        <div className="flex justify-between font-bold">
                                                            <span>{o.itemName}</span>
                                                            <span className="text-orange-600">₹{o.price}</span>
                                                        </div>
                                                        <div className="bg-white p-2.5 rounded border text-xs space-y-1">
                                                            <p><strong>Customer Name:</strong> {o.customerName}</p>
                                                            <p><strong>Customer Mobile:</strong> {o.customerMobile}</p>
                                                            <p><strong>Delivery Address:</strong> {o.customerAddress}</p>
                                                        </div>
                                                        <div className="flex justify-between items-center pt-1">
                                                            <span className="text-xs">Current Status: <strong className="text-orange-600">{o.status}</strong></span>
                                                            <select 
                                                                value={o.status} 
                                                                onChange={(e) => handleUpdateOrderStatus(o.id, e.target.value)}
                                                                className="border p-1 rounded text-xs bg-white font-semibold"
                                                            >
                                                                <option value="Pending">Pending</option>
                                                                <option value="Processing">Processing</option>
                                                                <option value="Out for Delivery">Out for Delivery</option>
                                                                <option value="Delivered">Delivered</option>
                                                            </select>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    </div>
                                )}

                                {activeModal === 'notifications' && (
                                    <div>
                                        <h2 className="text-xl font-bold mb-4 text-red-600">🔔 Admin Notifications</h2>
                                        <div className="space-y-3">
                                            {sellerNotifications.map(n => (
                                                <div key={n.id} className="bg-red-50 border-l-4 border-red-500 p-3 rounded text-sm">
                                                    <p className="font-semibold text-red-700">{n.message}</p>
                                                    <span className="text-xs text-gray-400">{n.time}</span>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
